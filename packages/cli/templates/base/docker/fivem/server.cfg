# =============================================================================
# FiveM Server Configuration — Development
# =============================================================================
# Edit to taste. Runtime values for the framework itself come from
# framework.config.yaml (at project root) — don't duplicate those here.
# =============================================================================

endpoint_add_tcp '0.0.0.0:30120'
endpoint_add_udp '0.0.0.0:30120'

sv_hostname '[DEV] {{PROJECT_NAME}}'
sv_maxclients 32

sv_scriptHookAllowed 0
sv_endpointPrivacy true
sv_lan 0

set onesync on
set onesync_population false

# Load the framework resource (mounted from ../../resource/)
ensure {{PROJECT_NAME}}

rcon_password 'changeme'

# -----------------------------------------------------------------------------
# Framework Convars
# -----------------------------------------------------------------------------
# These are read by @merinaa/server at bootstrap (ConfigService.loadDefaults).
# Values here override framework.config.yaml.
# -----------------------------------------------------------------------------
setr mysql_connection_string 'mysql://fivem:fivem123@mysql:3306/{{PROJECT_NAME}}'
setr framework_env 'development'
setr framework_debug 'true'
setr framework_locale 'de'
